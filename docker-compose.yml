services:
  postgres-db:
    container_name: application-database
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sd_plat
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

volumes:
  postgres_data:
